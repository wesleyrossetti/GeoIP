stages:
  - deploy

upload_to_backblaze_alt:
  stage: deploy
  image: minio/mc:latest  # Cliente MinIO, excelente para S3 compatível
  script:
    # Configurar credenciais usando cliente MinIO
    - mc alias set backblaze $endpoint_s3 $keyID_s3 $applicationKey_s3
    
    # Verificar a configuração
    - mc ls backblaze

    # Fazer upload com cliente MinIO
    - cd GeoIP_Paises && find . -type f -print0 | 
      while IFS= read -r -d '' file; do
        mc cp "$file" "backblaze/$bucket_s3/GeoIP-Paises/${file:2}"
      done
    
    # Listar arquivos enviados
    - mc ls "backblaze/$bucket_s3/GeoIP-Paises/"
  only:
    - main