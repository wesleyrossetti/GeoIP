stages:
  - deploy

upload_to_backblaze:
  stage: deploy
  image: minio/mc:latest  # Imagem oficial do MinIO Client
  script:
    # Configurar o alias para o Backblaze
    - mc alias set backblaze $endpoint_s3 $keyID_s3 $applicationKey_s3
    
    # Verificar existência da pasta local
    - if [ ! -d "GeoIP_Paises" ]; then echo "Pasta GeoIP_Paises não encontrada!"; exit 1; fi
    - echo "Arquivos a serem enviados:"
    - ls -la GeoIP_Paises/
    
    # Fazer upload diretamente para o bucket específico
    - echo "Enviando arquivos para o bucket $bucket_s3..."
    - |
      cd GeoIP_Paises
      for file in *; do
        if [ -f "$file" ]; then
          echo "Enviando $file para backblaze/$bucket_s3/GeoIP-Paises/"
          mc cp "$file" "backblaze/$bucket_s3/GeoIP-Paises/" || echo "Erro ao enviar $file"
        fi
      done
    
    # Tentar listar os arquivos no bucket específico (apenas como verificação)
    - echo "Tentando listar arquivos no bucket..."
    - mc ls "backblaze/$bucket_s3/GeoIP-Paises/" || echo "Não foi possível listar, mas o upload pode ter funcionado"
  only:
    - main