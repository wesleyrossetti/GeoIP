stages:
  - build
  - deploy

generate_geoip_lists:
  stage: build
  image: python:3.9
  script:
    # Instalar dependências
    - pip install -r requirements.txt
    
    # Verificar se o arquivo MMDB está disponível
    #- if [ ! -f "GeoLite2-Country.mmdb" ]; then echo "Arquivo GeoLite2-Country.mmdb não encontrado!"; exit 1; fi

    # Variáveis da licença MaxMind (coloque isso em CI/CD > Variables)
    - LICENSE_KEY=${MAXMIND_LICENSE_KEY}
    - SUFFIX="tar.gz"
    - DOWNLOAD_URL="https://download.maxmind.com/app/geoip_download?edition_id=$EDITION&license_key=$LICENSE_KEY&suffix=$SUFFIX"

    # Baixar e extrair o MMDB
    - echo "Baixando o banco de dados GeoLite2-Country..."
    - curl -L -o "${EDITION_ID}.${SUFFIX}" "$DOWNLOAD_URL"
    - mkdir -p geoip_tmp
    - tar -xzf "${EDITION_ID}.${SUFFIX}" -C geoip_tmp --strip-components=1
    - cp geoip_tmp/*.mmdb GeoLite2-Country.mmdb

    # Executar o script gerador
    - python gerador_de_listas.py
    
    # Verificar se a pasta foi criada corretamente
    - ls -la GeoIP_Paises/
  artifacts:
    paths:
      - GeoIP_Paises/
    expire_in: 1 hour
  only:
    - main

upload_to_backblaze:
  stage: deploy
  image: python:3.9
  before_script:
    - pip install boto3 --quiet
  script:
    - |
      python3 << 'EOF'
      import boto3
      import os
      import sys
      from pathlib import Path
      from botocore.config import Config

      local_dir = Path("GeoIP_Paises")
      if not local_dir.is_dir():
          print("Pasta GeoIP_Paises não encontrada!")
          sys.exit(1)

      s3 = boto3.client(
          "s3",
          endpoint_url=os.environ["endpoint_s3"],
          aws_access_key_id=os.environ["keyID_s3"],
          aws_secret_access_key=os.environ["applicationKey_s3"],
          config=Config(signature_version="s3v4"),
      )

      bucket = os.environ["bucket_s3"]
      files = [f for f in local_dir.rglob("*") if f.is_file()]
      print(f"Iniciando upload de {len(files)} arquivos para {bucket}/GeoIP-Paises/")

      for f in files:
          key = "GeoIP-Paises/" + "/".join(f.relative_to(local_dir).parts)
          s3.upload_file(str(f), bucket, key)
          print(f"  uploaded: {key}")

      print(f"Upload de {len(files)} arquivos concluído com sucesso!")
      EOF
  only:
    - main