stages:
  - build
  - deploy

generate_geoip_lists:
  stage: build
  image: python:3.9
  script:
    # Instalar dependências
    - pip install -r requirements.txt
    
    # Verificar se o arquivo MMDB está disponível
    #- if [ ! -f "GeoLite2-Country.mmdb" ]; then echo "Arquivo GeoLite2-Country.mmdb não encontrado!"; exit 1; fi

    # Variáveis da licença MaxMind (coloque isso em CI/CD > Variables)
    - LICENSE_KEY=${MAXMIND_LICENSE_KEY}
    - EDITION_ID="GeoLite2-Country"
    - SUFFIX="tar.gz"
    - DOWNLOAD_URL="https://download.maxmind.com/app/geoip_download?edition_id=$EDITION_ID&license_key=$LICENSE_KEY&suffix=$SUFFIX"

    # Baixar e extrair o MMDB
    - echo "Baixando o banco de dados GeoLite2-Country..."
    - curl -L -o "${EDITION_ID}.${SUFFIX}" "$DOWNLOAD_URL"
    - tar -xzf "${EDITION_ID}.${SUFFIX}"
    - MMDB_FILE=$(find . -type f -name "*.mmdb" | head -n1)
    - cp "$MMDB_FILE" GeoLite2-Country.mmdb
    
    # Executar o script gerador
    - python gerador_de_listas.py
    
    # Verificar se a pasta foi criada corretamente
    - ls -la GeoIP_Paises/
  artifacts:
    paths:
      - GeoIP_Paises/
    expire_in: 1 hour
  only:
    - main

upload_to_backblaze:
  stage: deploy
  image: minio/mc:latest
  script:
    # Configurar o alias para o Backblaze
    - mc alias set backblaze $endpoint_s3 $keyID_s3 $applicationKey_s3
    
    # Verificar existência da pasta local
    - if [ ! -d "GeoIP_Paises" ]; then echo "Pasta GeoIP_Paises não encontrada!"; exit 1; fi
    
    # Contar e exibir total de arquivos para referência
    - TOTAL_FILES=$(find GeoIP_Paises -type f | wc -l)
    - echo "Iniciando upload de $TOTAL_FILES arquivos para backblaze/$bucket_s3/GeoIP-Paises/"
    
    # Upload otimizado para arquivos pequenos
    - mc cp --recursive --disable-multipart GeoIP_Paises/ "backblaze/$bucket_s3/GeoIP-Paises/"
    
    # Confirmação de sucesso
    - echo "Upload de $TOTAL_FILES arquivos concluído com sucesso!"
  only:
    - main