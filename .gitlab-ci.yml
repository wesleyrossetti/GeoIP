stages:
  - deploy

upload_to_backblaze:
  stage: deploy
  image: python:3.9-alpine
  script:
    # Instalar AWS CLI
    - pip install awscli
    
    # Configurar credenciais Backblaze B2
    - mkdir -p ~/.aws
    - >
      echo "[default]
      aws_access_key_id = $keyID_s3
      aws_secret_access_key = $applicationKey_s3
      region = us-west-002" > ~/.aws/credentials
    
    # Configurar AWS CLI para B2
    - >
      echo "[default]
      region = us-west-002
      s3 =
          signature_version = s3v4
          addressing_style = virtual
      [plugins]
      endpoint = awscli_plugin_endpoint" > ~/.aws/config
      
    # Suprimir avisos de SSL
    - export AWS_CA_BUNDLE=false
    - export PYTHONWARNINGS="ignore:Unverified HTTPS request"
    
    # Verificar pasta local
    - if [ ! -d "GeoIP_Paises" ]; then echo "Pasta GeoIP_Paises não encontrada!"; exit 1; fi
    
    # Listar arquivos a serem enviados
    - ls -la GeoIP_Paises/
    
    # Upload para B2 com parâmetros corretos
    - >
      aws s3 sync GeoIP_Paises/ s3://$bucket_s3/GeoIP-Paises/
      --endpoint-url=$endpoint_s3
      --region=us-west-002
      --no-verify-ssl
      
    # Verificar upload (com tratamento de erro)
    - >
      aws s3 ls s3://$bucket_s3/GeoIP-Paises/
      --endpoint-url=$endpoint_s3
      --region=us-west-002
      --no-verify-ssl
  only:
    - main